[project]
site_name = "System Administration Wiki (Debian 13)"
site_description = "系統管理課程（Debian 13）考試複習導向 LLM Wiki"
# 部署至 GitHub Pages 前，請取消下方註解並填入實際網址（設定後可同步啟用下方的 "navigation.instant"）
# site_url = "https://<username>.github.io/<repo>/"
docs_dir = "wiki"
site_dir = "site"
nav = [
    { "首頁與總目錄" = "index.md" },
    { "課程主題筆記" = [
        { "Shell：命令列、管線與文字處理" = "shell.md" },
        { "Shell 腳本設計：流程控制、健壯性與 sed / awk" = "shell-programming.md" },
        { "Docker 基礎：容器概念、安裝與常用指令" = "docker-basic.md" },
        { "檔案系統：架構、Inode、連結與權限管理" = "filesystem.md" },
        { "邏輯捲宗管理（LVM）：架構、精簡配置、快照與磁碟擴縮實戰" = "lvm.md" },
        { "Btrfs（B-Tree Filesystem）：Subvolume、佈局、快照與遷移實戰" = "btrfs.md" },
    ] },
    { "跨章比較與綜合整理" = [
        { "儲存管理總對照：傳統分割區、LVM 與 Btrfs" = "storage-partition-lvm-btrfs.md" },
    ] },
    { "知識庫維運" = [
        { "標籤索引" = "tags.md" },
        { "演進日誌" = "log.md" },
    ] },
]

[project.theme]
variant = "modern"
language = "zh-TW"
features = [
    # "navigation.instant",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "toc.follow",
    "search.highlight",
    "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "切換深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "切換淺色模式"

[project.plugins.search]
enabled = true

[project.plugins.tags]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
